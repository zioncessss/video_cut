appId: com.videocut.desktop
productName: VideoCut
copyright: Copyright © 2026 VideoCut Team

directories:
  output: dist
  buildResources: resources

publish: null

files:
  - out/**/*
  - "!resources/**/*"
  - package.json
  - node_modules/**/*
  - "!node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!node_modules/*/{test,__tests__,tests,powertest,example,examples}"
  - "!node_modules/*.d.ts"
  - "!node_modules/.bin"

extraResources:
  - from: resources/
    to: .
    filter:
      - "**/*"
      - "!icon.icns"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  include: resources/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VideoCut 极速剪辑
  artifactName: ${productName}-Setup-${version}.${ext}
  uninstallDisplayName: ${productName} 卸载
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: zip
      arch:
        - x64
        - arm64
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.video
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${arch}-mac.${ext}

dmg:
  title: ${productName} ${version} (${arch})
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications