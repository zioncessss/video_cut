name: Cross Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python & Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Setup macOS FFmpeg & Build macOS Sidecar
        if: matrix.os == 'macos-latest'
        run: |
          brew install ffmpeg
          mkdir -p resources/engine/bin
          cp $(which ffmpeg) resources/engine/bin/ffmpeg
          cp $(which ffprobe) resources/engine/bin/ffprobe
          chmod +x resources/engine/bin/*
          python -m PyInstaller --noconfirm --clean --name videocut-engine \
            --paths backend \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            backend/engine_main.py \
            --distpath build_engine/dist --workpath build_engine/work --specpath build_engine
          cp -r build_engine/dist/videocut-engine resources/engine/
          chmod +x resources/engine/videocut-engine/videocut-engine

      - name: Setup Windows FFmpeg & Build Windows Sidecar
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/engine/bin | Out-Null
          $ffmpegCmd = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($ffmpegCmd) {
            Copy-Item $ffmpegCmd.Source resources/engine/bin/ffmpeg.exe -Force
          }
          $ffprobeCmd = Get-Command ffprobe.exe -ErrorAction SilentlyContinue
          if ($ffprobeCmd) {
            Copy-Item $ffprobeCmd.Source resources/engine/bin/ffprobe.exe -Force
          }
          python -m PyInstaller --noconfirm --clean --name videocut-engine `
            --paths backend `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            backend/engine_main.py `
            --distpath build_engine/dist --workpath build_engine/work --specpath build_engine
          Copy-Item build_engine/dist/videocut-engine resources/engine/videocut-engine -Recurse -Force

      - name: Install Frontend Dependencies
        run: |
          pnpm install --frozen-lockfile=false

      - name: Build Desktop Application (Electron + Vite)
        run: |
          pnpm build

      - name: Package Windows Application (x64 NSIS)
        if: matrix.os == 'windows-latest'
        run: |
          npx electron-builder --win -p never

      - name: Package macOS Applications (Intel x64 + Apple Silicon arm64 DMG/ZIP)
        if: matrix.os == 'macos-latest'
        run: |
          npx electron-builder --mac --x64 -p never
          npx electron-builder --mac --arm64 -p never

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: videocut-${{ matrix.os }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            scripts/fix-macos-gatekeeper.command
            scripts/fix-macos-gatekeeper.sh
            resources/一键解除Mac拦截.command
          if-no-files-found: warn

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: VideoCut ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            scripts/fix-macos-gatekeeper.command
            scripts/fix-macos-gatekeeper.sh
            resources/一键解除Mac拦截.command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}