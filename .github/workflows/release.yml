name: Cross Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
            name: Windows-x64
          - os: macos-latest
            arch: arm64
            target: mac-arm64
            name: macOS-AppleSilicon-arm64
          - os: macos-13
            arch: x64
            target: mac-x64
            name: macOS-Intel-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: 'pip'

      - name: Install Python & Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          python -c "import sys; sys.path.insert(0, 'backend'); import PIL, cv2, numpy, certifi, multipart; from app.api import materials, editor, batch; print('Python sidecar dependencies verified successfully')"

      # macOS 构建步骤：下载对应架构的静态独立 FFmpeg 并构建匹配架构的原生 Python 算力引擎
      - name: Setup macOS FFmpeg & Build macOS Sidecar
        if: runner.os == 'macOS'
        run: |
          mkdir -p resources/engine/bin
          echo "Downloading static FFmpeg & FFprobe for ${{ matrix.arch }}..."
          curl -fSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-${{ matrix.arch }}" -o resources/engine/bin/ffmpeg
          curl -fSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-${{ matrix.arch }}" -o resources/engine/bin/ffprobe
          chmod +x resources/engine/bin/*
          chmod +x scripts/*.command resources/*.command 2>/dev/null || true
          echo "FFmpeg binary architecture:"
          file resources/engine/bin/ffmpeg
          file resources/engine/bin/ffprobe

          # 植入默认词库与违禁词字典资源
          mkdir -p resources/default_storage
          [ -f storage/glossary.json ] && cp storage/glossary.json resources/default_storage/ || true
          [ -f storage/banned_words.json ] && cp storage/banned_words.json resources/default_storage/ || true

          # 构建原生 Mach-O Python 算力引擎 (使用绝对路径防御 specpath 相对路径错误)
          SCHEMA_SRC="$PWD/backend/app/db/schema.sql"
          python -m PyInstaller --noconfirm --clean --name videocut-engine \
            --paths backend \
            --collect-all certifi \
            --collect-all cv2 \
            --collect-all PIL \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import PIL \
            --hidden-import cv2 \
            --hidden-import numpy \
            --hidden-import certifi \
            --hidden-import multipart \
            --hidden-import app.api.materials \
            --hidden-import app.api.editor \
            --hidden-import app.api.batch \
            --hidden-import app.api.instruction \
            --hidden-import app.api.system \
            --hidden-import app.api.settings \
            --hidden-import app.api.chat \
            --hidden-import app.harness_bridge.factory \
            --hidden-import app.harness_bridge.api_engine \
            --hidden-import app.harness_bridge.codex \
            --hidden-import app.harness_bridge.zcode \
            --hidden-import app.harness_bridge.embedded \
            --add-data "$SCHEMA_SRC:app/db" \
            backend/engine_main.py \
            --distpath build_engine/dist --workpath build_engine/work --specpath build_engine
          rm -rf resources/engine/videocut-engine
          cp -r build_engine/dist/videocut-engine resources/engine/
          chmod -R +x resources/engine/videocut-engine
          echo "videocut-engine binary architecture:"
          file resources/engine/videocut-engine/videocut-engine

      # Windows 构建步骤
      - name: Setup Windows FFmpeg & Build Windows Sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/engine/bin | Out-Null
          echo "Downloading static FFmpeg & FFprobe for Windows x64..."
          curl.exe -fSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64" -o resources/engine/bin/ffmpeg.exe
          curl.exe -fSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-win32-x64" -o resources/engine/bin/ffprobe.exe
          $SchemaSrc = Join-Path $PWD "backend\app\db\schema.sql"
          python -m PyInstaller --noconfirm --clean --name videocut-engine `
            --paths backend `
            --collect-all certifi `
            --collect-all cv2 `
            --collect-all PIL `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import PIL `
            --hidden-import cv2 `
            --hidden-import numpy `
            --hidden-import certifi `
            --hidden-import multipart `
            --hidden-import app.api.materials `
            --hidden-import app.api.editor `
            --hidden-import app.api.batch `
            --hidden-import app.api.instruction `
            --hidden-import app.api.system `
            --hidden-import app.api.settings `
            --hidden-import app.api.chat `
            --hidden-import app.harness_bridge.factory `
            --hidden-import app.harness_bridge.api_engine `
            --hidden-import app.harness_bridge.codex `
            --hidden-import app.harness_bridge.zcode `
            --hidden-import app.harness_bridge.embedded `
            --add-data "$SchemaSrc`;app/db" `
            backend/engine_main.py `
            --distpath build_engine/dist --workpath build_engine/work --specpath build_engine
          if (Test-Path resources/engine/videocut-engine) { Remove-Item resources/engine/videocut-engine -Recurse -Force }
          Copy-Item build_engine/dist/videocut-engine resources/engine/videocut-engine -Recurse -Force
          New-Item -ItemType Directory -Force -Path resources/default_storage | Out-Null
          if (Test-Path "storage/glossary.json") { Copy-Item "storage/glossary.json" "resources/default_storage/glossary.json" -Force }
          if (Test-Path "storage/banned_words.json") { Copy-Item "storage/banned_words.json" "resources/default_storage/banned_words.json" -Force }

      - name: Install Frontend Dependencies
        run: |
          pnpm install --frozen-lockfile=false

      - name: Build Desktop Application (Electron + Vite)
        run: |
          pnpm build

      - name: Package Windows Application (x64 NSIS)
        if: runner.os == 'Windows'
        run: |
          npx electron-builder --win -p never

      - name: Package macOS Application
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac --${{ matrix.arch }} -p never

      # 直接将各平台产物发布到 GitHub Release（彻底规避 upload-artifact 500MB 存储配额限制）
      - name: Release Platform Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VideoCut ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            resources/一键解除Mac拦截.command
            scripts/fix-macos-gatekeeper.command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}